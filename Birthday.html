<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐 - 3D 祝福球体</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ========== 星空画布层 ========== */
        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ========== 标题层 ========== */
        .title-container {
            position: fixed;
            top: clamp(16px, 4vh, 40px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            animation: titleFadeIn 1.5s ease-out 0.3s both;
        }

        .title {
            font-size: clamp(24px, 5vw, 48px);
            font-weight: 700;
            letter-spacing: 0.08em;
            background: linear-gradient(135deg, #ff6b9d, #c44dff, #4dc9f6, #f6cd4d);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease-in-out infinite;
            text-shadow: none;
            filter: drop-shadow(0 0 20px rgba(196, 77, 255, 0.5));
        }

        .subtitle {
            margin-top: clamp(4px, 1vh, 10px);
            font-size: clamp(12px, 2vw, 18px);
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.15em;
            animation: subtitlePulse 3s ease-in-out infinite;
        }

        @keyframes titleFadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
        }

        @keyframes subtitlePulse {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 0.8;
            }
        }

        /* ========== 3D 场景容器 ========== */
        .scene {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            z-index: 5;
            pointer-events: none;
        }

        /* ========== 3D 球体旋转层 ========== */
        .sphere {
            position: relative;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            will-change: transform;
            pointer-events: auto;
        }

        /* ========== 卡片样式 ========== */
        .card {
            position: absolute;
            top: 0;
            left: 0;
            width: clamp(95px, 14vw, 175px);
            height: clamp(65px, 10vw, 120px);
            margin-left: calc(clamp(95px, 14vw, 175px) / -2);
            margin-top: calc(clamp(65px, 10vw, 120px) / -2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(2px, 0.5vw, 6px);
            padding: clamp(8px, 1.5vw, 16px);
            border-radius: 16px;
            cursor: pointer;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translateZ(0);
            background: rgba(20, 20, 40, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: box-shadow 0.4s ease, background 0.4s ease, border-color 0.4s ease;
        }

        .card-icon {
            position: relative;
            z-index: 2;
            font-size: clamp(14px, 2.5vw, 24px);
            pointer-events: none;
        }

        .card-text {
            position: relative;
            z-index: 2;
            font-size: clamp(10px, 1.3vw, 14px);
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            line-height: 1.5;
            letter-spacing: 0.04em;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        /* hover 微动效 */
        .card:hover {
            background: rgba(30, 30, 60, 0.7);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .card:hover .card-text {
            text-shadow: 0 0 16px rgba(255, 255, 255, 0.6);
        }

        /* ========== 浮动粒子环绕 ========== */
        .orbital-particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            animation: orbitFloat 8s ease-in-out infinite;
        }

        @keyframes orbitFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }
            25% {
                transform: translate(40px, -30px) scale(1.5);
                opacity: 0.7;
            }
            50% {
                transform: translate(-20px, -50px) scale(0.8);
                opacity: 0.4;
            }
            75% {
                transform: translate(-40px, 20px) scale(1.3);
                opacity: 0.6;
            }
        }

        /* ========== 响应式适配 ========== */
        @media (max-width: 480px) {
            .card {
                width: 90px;
                height: 62px;
                margin-left: -45px;
                margin-top: -31px;
                border-radius: 12px;
                padding: 6px;
                gap: 2px;
            }
            .card-text {
                font-size: 10px;
                line-height: 1.4;
            }
            .card-icon {
                font-size: 12px;
            }
            .scene {
                perspective: 800px;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .card {
                width: 110px;
                height: 76px;
                margin-left: -55px;
                margin-top: -38px;
                border-radius: 14px;
                padding: 8px;
                gap: 3px;
            }
            .card-text {
                font-size: 11px;
            }
            .card-icon {
                font-size: 16px;
            }
            .scene {
                perspective: 1000px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .card {
                width: 140px;
                height: 96px;
                margin-left: -70px;
                margin-top: -48px;
            }
            .card-text {
                font-size: 13px;
            }
            .card-icon {
                font-size: 20px;
            }
        }

        @media (min-width: 1025px) {
            .card {
                width: 170px;
                height: 116px;
                margin-left: -85px;
                margin-top: -58px;
            }
            .card-text {
                font-size: 14px;
            }
            .card-icon {
                font-size: 24px;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .title-container {
                top: 8px;
            }
            .title {
                font-size: 20px;
            }
            .subtitle {
                font-size: 11px;
                margin-top: 2px;
            }
            .card {
                width: 80px;
                height: 54px;
                margin-left: -40px;
                margin-top: -27px;
                border-radius: 10px;
                padding: 4px;
                gap: 1px;
            }
            .card-text {
                font-size: 9px;
                line-height: 1.3;
            }
            .card-icon {
                font-size: 10px;
            }
            .scene {
                perspective: 700px;
            }
        }
    </style>
</head>
<body>

    <!-- 星空背景画布 -->
    <canvas id="starCanvas"></canvas>

    <!-- 标题 -->
    <div class="title-container">
        <h1 class="title">🎂 生日快乐 🎂</h1>
        <p class="subtitle">愿所有美好如期而至</p>
    </div>

    <!-- 3D 场景 -->
    <div class="scene" id="scene">
        <div class="sphere" id="sphere"></div>
    </div>

    <script>
        (function() {
            // ==================== 配置 ====================
            const CONFIG = {
                cardCount: 19,
                autoRotateSpeed: 0.25,
                entranceDurationBase: 2600,
                entranceDurationRange: 400,
                entranceDelayMax: 600,
                lerpFactor: 0.06,
                mouseInfluenceX: 25,
                mouseInfluenceY: 18,
                touchInfluenceX: 35,
                touchInfluenceY: 25,
                starCount: 150,
            };

            // ==================== 19句生日祝福语 ====================
            const wishes = [
                '生日快乐，岁岁常欢愉',
                '愿你永远被爱包围',
                '平安喜乐，万事胜意',
                '岁岁年年，万喜万般宜',
                '生日快乐，前程似锦',
                '愿你眼中有光，笑里坦荡',
                '生辰吉乐，顺问冬安',
                '日子滚烫，快乐至上',
                '岁岁平安，年年有余',
                '生日快乐，心想事成',
                '愿你一生温暖纯良',
                '烟火向星辰，所愿皆成真',
                '新岁，新光，新欢喜',
                '岁岁常欢愉，年年皆胜意',
                '生日快乐，永远向阳',
                '好运常在，笑口常开',
                '以梦为马，不负韶华',
                '生辰快乐，幸福常伴',
                '愿你奔赴山海，归来仍是少年',
            ];

            // ==================== 霓虹调色板 ====================
            const neonPalette = [
                { gradient: 'linear-gradient(135deg, #ff6b9d, #ff8e8e)', glow: 'rgba(255,107,157,0.5)' },
                { gradient: 'linear-gradient(135deg, #c44dff, #9b59b6)', glow: 'rgba(196,77,255,0.5)' },
                { gradient: 'linear-gradient(135deg, #4dc9f6, #00d2ff)', glow: 'rgba(77,201,246,0.5)' },
                { gradient: 'linear-gradient(135deg, #667eea, #764ba2)', glow: 'rgba(102,126,234,0.5)' },
                { gradient: 'linear-gradient(135deg, #f6cd4d, #f093fb)', glow: 'rgba(246,205,77,0.5)' },
            ];

            const icons = ['✨', '🌟', '💫', '🎀', '💝', '🌸', '🕊️', '🎵', '💖', '🌙', '⭐', '🎁', '💐', '🦋', '🍀',
                '🎈', '💎', '🔥', '🌈'
            ];

            // ==================== DOM 引用 ====================
            const starCanvas = document.getElementById('starCanvas');
            const starCtx = starCanvas.getContext('2d');
            const sphere = document.getElementById('sphere');
            const scene = document.getElementById('scene');

            // ==================== 状态 ====================
            let sphereRadius = 280;
            let rotationY = 0;
            let rotationX = 0;
            let targetRotationY = 0;
            let targetRotationX = 0;
            let autoAngle = 0;
            let mouseNormX = 0;
            let mouseNormY = 0;
            let isTouchActive = false;
            let touchStartX = 0;
            let touchStartY = 0;
            let touchDeltaX = 0;
            let touchDeltaY = 0;
            let cards = [];
            let cardPositions = [];
            let stars = [];
            let animationId = null;

            // ==================== 计算响应式球体半径 ====================
            function calcSphereRadius() {
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const base = Math.min(vw, vh) * 0.38;
                sphereRadius = Math.max(120, Math.min(340, base));
            }

            // ==================== Fibonacci 球体分布算法 ====================
            function getSpherePosition(index, total, radius) {
                const phi = Math.PI * (3 - Math.sqrt(5));
                const y = 1 - (index / (total - 1)) * 2;
                const radiusAtY = Math.sqrt(1 - y * y);
                const theta = phi * index;

                const x = Math.cos(theta) * radiusAtY;
                const z = Math.sin(theta) * radiusAtY;

                const rotateYDeg = Math.atan2(x, z) * (180 / Math.PI);
                const rotateXDeg = -Math.asin(y) * (180 / Math.PI);

                return {
                    rotateY: rotateYDeg,
                    rotateX: rotateXDeg,
                    translateZ: radius,
                    x: x * radius,
                    y: y * radius,
                    z: z * radius,
                };
            }

            // ==================== 生成卡片 ====================
            function createCards() {
                sphere.innerHTML = '';
                cards = [];
                cardPositions = [];

                calcSphereRadius();

                for (let i = 0; i < CONFIG.cardCount; i++) {
                    const pos = getSpherePosition(i, CONFIG.cardCount, sphereRadius);
                    cardPositions.push(pos);

                    const palette = neonPalette[i % neonPalette.length];
                    const icon = icons[i % icons.length];

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.boxShadow =
                        `0 0 18px ${palette.glow}, 0 0 36px ${palette.glow.replace('0.5', '0.2')}, inset 0 0 18px ${palette.glow.replace('0.5', '0.08')}`;
                    card.setAttribute('data-index', i);

                    card.innerHTML = `
                        <span class="card-icon">${icon}</span>
                        <p class="card-text">${wishes[i]}</p>
                    `;

                    sphere.appendChild(card);
                    cards.push(card);
                }
            }

            // ==================== 入场动画（Web Animations API） ====================
            function playEntranceAnimations() {
                cards.forEach((card, i) => {
                    const pos = cardPositions[i];
                    const randomStartRY = (Math.random() - 0.5) * 720;
                    const randomStartRX = (Math.random() - 0.5) * 360;
                    const randomStartTZ = 1800 + Math.random() * 1200;
                    const duration = CONFIG.entranceDurationBase + Math.random() * CONFIG.entranceDurationRange;
                    const delay = (i / CONFIG.cardCount) * CONFIG.entranceDelayMax + Math.random() * 150;

                    const animation = card.animate([
                        {
                            transform: `rotateY(${randomStartRY}deg) rotateX(${randomStartRX}deg) translateZ(${randomStartTZ}px) scale(0)`,
                            opacity: 0,
                            offset: 0,
                        },
                        {
                            transform: `rotateY(${pos.rotateY}deg) rotateX(${pos.rotateX}deg) translateZ(${pos.translateZ}px) scale(1)`,
                            opacity: 1,
                            offset: 1,
                        },
                    ], {
                        duration: duration,
                        delay: delay,
                        easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)',
                        fill: 'forwards',
                    });

                    animation.onfinish = () => {
                        card.style.transform =
                            `rotateY(${pos.rotateY}deg) rotateX(${pos.rotateX}deg) translateZ(${pos.translateZ}px)`;
                        card.style.opacity = '1';
                    };
                });
            }

            // ==================== 星空背景 ====================
            function initStars() {
                starCanvas.width = window.innerWidth;
                starCanvas.height = window.innerHeight;
                stars = [];

                for (let i = 0; i < CONFIG.starCount; i++) {
                    stars.push({
                        x: Math.random() * starCanvas.width,
                        y: Math.random() * starCanvas.height,
                        r: Math.random() * 1.6 + 0.3,
                        baseOpacity: Math.random() * 0.5 + 0.2,
                        opacity: Math.random(),
                        speed: 0.003 + Math.random() * 0.012,
                        phase: Math.random() * Math.PI * 2,
                    });
                }
            }

            function drawStars(timestamp) {
                starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);

                const t = timestamp * 0.001;
                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];
                    s.opacity = s.baseOpacity + Math.sin(t * s.speed * 60 + s.phase) * 0.25;
                    s.opacity = Math.max(0.08, Math.min(0.9, s.opacity));

                    starCtx.beginPath();
                    starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    starCtx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
                    starCtx.fill();

                    if (s.r > 1.0 && s.opacity > 0.5) {
                        starCtx.beginPath();
                        starCtx.arc(s.x, s.y, s.r * 2.5, 0, Math.PI * 2);
                        starCtx.fillStyle = `rgba(180, 200, 255, ${s.opacity * 0.12})`;
                        starCtx.fill();
                    }
                }
            }

            // ==================== 主循环：自动旋转 + 鼠标/触摸交互 ====================
            function animate(timestamp) {
                drawStars(timestamp);

                autoAngle += CONFIG.autoRotateSpeed;

                if (!isTouchActive) {
                    targetRotationY = autoAngle + mouseNormX * CONFIG.mouseInfluenceX;
                    targetRotationX = mouseNormY * CONFIG.mouseInfluenceY;
                } else {
                    targetRotationY = autoAngle + touchDeltaX * CONFIG.touchInfluenceX;
                    targetRotationX = touchDeltaY * CONFIG.touchInfluenceY;
                }

                rotationY += (targetRotationY - rotationY) * CONFIG.lerpFactor;
                rotationX += (targetRotationX - rotationX) * CONFIG.lerpFactor;

                sphere.style.transform = `rotateY(${rotationY}deg) rotateX(${rotationX}deg)`;

                animationId = requestAnimationFrame(animate);
            }

            // ==================== 鼠标交互 ====================
            function onMouseMove(e) {
                if (isTouchActive) return;
                mouseNormX = (e.clientX / window.innerWidth - 0.5) * 2;
                mouseNormY = (e.clientY / window.innerHeight - 0.5) * 2;
            }

            // ==================== 触摸交互 ====================
            function onTouchStart(e) {
                if (e.touches.length === 1) {
                    isTouchActive = true;
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    touchDeltaX = 0;
                    touchDeltaY = 0;
                }
            }

            function onTouchMove(e) {
                if (!isTouchActive || e.touches.length !== 1) return;
                const dx = e.touches[0].clientX - touchStartX;
                const dy = e.touches[0].clientY - touchStartY;
                touchDeltaX = dx / window.innerWidth;
                touchDeltaY = dy / window.innerHeight;
            }

            function onTouchEnd() {
                isTouchActive = false;
                touchDeltaX = 0;
                touchDeltaY = 0;
            }

            // ==================== 窗口大小变化处理 ====================
            function onResize() {
                calcSphereRadius();
                starCanvas.width = window.innerWidth;
                starCanvas.height = window.innerHeight;

                for (let i = 0; i < stars.length; i++) {
                    stars[i].x = Math.random() * starCanvas.width;
                    stars[i].y = Math.random() * starCanvas.height;
                }

                cardPositions = [];
                for (let i = 0; i < CONFIG.cardCount; i++) {
                    const pos = getSpherePosition(i, CONFIG.cardCount, sphereRadius);
                    cardPositions.push(pos);
                }

                cards.forEach((card, i) => {
                    const pos = cardPositions[i];
                    card.style.transform =
                        `rotateY(${pos.rotateY}deg) rotateX(${pos.rotateX}deg) translateZ(${pos.translateZ}px)`;
                });
            }

            // ==================== 浮动装饰粒子 ====================
            function createOrbitalParticles() {
                const colors = ['#ff6b9d', '#c44dff', '#4dc9f6', '#667eea', '#f6cd4d'];
                for (let i = 0; i < 12; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'orbital-particle';
                    const size = 2 + Math.random() * 4;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    particle.style.background = colors[i % colors.length];
                    particle.style.boxShadow = `0 0 ${size * 3}px ${colors[i % colors.length]}`;
                    particle.style.left = (15 + Math.random() * 70) + '%';
                    particle.style.top = (15 + Math.random() * 70) + '%';
                    particle.style.animationDuration = (6 + Math.random() * 10) + 's';
                    particle.style.animationDelay = Math.random() * 5 + 's';
                    document.body.appendChild(particle);
                }
            }

            // ==================== 初始化入口 ====================
            function init() {
                createCards();
                initStars();
                createOrbitalParticles();

                setTimeout(() => {
                    playEntranceAnimations();
                }, 200);

                animationId = requestAnimationFrame(animate);

                window.addEventListener('mousemove', onMouseMove, { passive: true });
                window.addEventListener('touchstart', onTouchStart, { passive: true });
                window.addEventListener('touchmove', onTouchMove, { passive: true });
                window.addEventListener('touchend', onTouchEnd);
                window.addEventListener('touchcancel', onTouchEnd);
                window.addEventListener('resize', onResize);
            }

            // ==================== 启动 ====================
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
